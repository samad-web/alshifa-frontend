server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ─── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # ─── Security headers ─────────────────────────────────────────────────────
    # CSP is intentionally omitted here — the app uses inline styles (Tailwind
    # JIT) and connects to Supabase / Sentry / the backend on different hosts.
    # Set a tailored CSP at your edge (Cloudflare / load balancer) where the
    # list of upstream hosts is already configured.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    # HSTS — enable once the deployment is fully on HTTPS.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ─── Load-balancer health probe ───────────────────────────────────────────
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ─── Hashed asset bundles — safe to cache forever ─────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── PWA files — must revalidate on every load ────────────────────────────
    # Service worker and manifest must NEVER be cached long-term or users get
    # stuck on a stale build after deploy.
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /registerSW.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.webmanifest {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.json {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ─── SPA fallback ─────────────────────────────────────────────────────────
    # index.html itself must not be cached, otherwise new deploys take hours
    # to reach returning users.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ─── Basic upload ceiling (matches backend UPLOAD_MAX_MB default) ─────────
    client_max_body_size 10m;

    # ─── Error pages fall through to the SPA ──────────────────────────────────
    error_page 404 /index.html;
}
